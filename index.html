<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Diario del sonno</title>
  <meta name="description" content="Personal analytics tool per sonno e screen time" />
  <meta name="theme-color" content="#F6F3EE" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <!-- iOS usa questa immagine per l'icona sulla schermata Home (180×180, sfondo pieno: iOS non gestisce la trasparenza) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sonno & Schermo" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"><p class="muted" style="padding:24px;">Caricamento…</p></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Se un file dell'app manca o non si carica (es. un file non caricato
    // durante l'aggiornamento), il modulo non parte e resterebbe solo
    // "Caricamento…". Dopo qualche secondo si mostra cosa fare.
    setTimeout(function () {
      if (window.__sslBooted) return;
      var app = document.getElementById('app');
      app.innerHTML = '';
      var box = document.createElement('div');
      box.setAttribute('role', 'alert');
      box.style.cssText = 'padding:24px;font-family:-apple-system,sans-serif;line-height:1.5';
      var p = document.createElement('p');
      p.textContent = "L'app non si è avviata. I tuoi dati salvati non sono stati toccati. Riprova; se succede di nuovo, controlla che tutti i file dell'app siano stati caricati (index.html, css/, js/, icons/).";
      var b = document.createElement('button');
      b.textContent = 'Riprova';
      b.style.cssText = 'margin-top:12px;min-height:44px;padding:0 18px;font-size:16px';
      b.onclick = function () { location.reload(); };
      box.appendChild(p); box.appendChild(b); app.appendChild(box);
    }, 6000);
  </script>
</body>
</html>
