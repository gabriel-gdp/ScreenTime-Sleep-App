<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6EEFA"/>
      <stop offset="1" stop-color="#B9DDF2"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A7E78"/>
      <stop offset="1" stop-color="#3A6762"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="610" cy="440" r="104" fill="#000"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g id="art" transform="translate(512 512) scale(1.12) translate(-515 -543)">
    <!-- ombra morbida -->
    <ellipse cx="530" cy="842" rx="250" ry="34" fill="#2F5F7A" opacity="0.16" filter="url(#soft)"/>
    <!-- pagine (bordo crema) -->
    <rect x="318" y="222" width="430" height="590" rx="44" fill="#FFF7E8"/>
    <rect x="318" y="222" width="430" height="590" rx="44" fill="none" stroke="#E9DCC3" stroke-width="6"/>
    <line x1="742" y1="290" x2="742" y2="750" stroke="#EADFC9" stroke-width="5"/>
    <line x1="728" y1="290" x2="728" y2="750" stroke="#EADFC9" stroke-width="5"/>
    <!-- copertina -->
    <rect x="282" y="200" width="436" height="600" rx="44" fill="url(#cover)"/>
    <!-- dorso -->
    <path d="M326 200 h40 v600 h-40 a44 44 0 0 1 -44 -44 v-512 a44 44 0 0 1 44 -44 z" fill="#2F5753"/>
    <line x1="366" y1="200" x2="366" y2="800" stroke="#5E918A" stroke-width="5" opacity="0.6"/>
    <!-- segnalibro -->
    <path d="M620 790 v96 l30 -26 l30 26 v-96 z" fill="#E3A64F"/>
    <!-- luna crescente -->
    <circle cx="560" cy="470" r="118" fill="#F7DC8E" mask="url(#crescent)"/>
    <!-- stelline -->
    <path d="M640 600 l9 24 l24 9 l-24 9 l-9 24 l-9 -24 l-24 -9 l24 -9 z" fill="#F7DC8E"/>
    <circle cx="470" cy="330" r="11" fill="#F7DC8E" opacity="0.9"/>
    <!-- etichetta sobria -->
    <rect x="446" y="660" width="200" height="18" rx="9" fill="#FFF7E8" opacity="0.35"/>
  </g>
</svg>
