<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 22 156 174" role="img" aria-label="Diario del sonno" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Logo A1 "Luna di pagine con nastro" (26/11/2026). La falce è fatta di
       pagine viste di taglio (le righe sono tagli trasparenti, quindi il segno
       funziona su qualsiasi fondo); il nastro del segnalibro richiama il diario.
       Colori per il tema chiaro; nella schermata iniziale lo stesso disegno è
       inline in index.html e prende i colori dal tema. -->
  <defs>
    <mask id="a1-moon" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <circle cx="100" cy="100" r="70" fill="#fff"/>
      <circle cx="127" cy="83" r="57" fill="#000"/>
      <g fill="none" stroke="#000" stroke-width="3.2"><circle cx="100" cy="100" r="61"/><circle cx="100" cy="100" r="52"/><circle cx="100" cy="100" r="43"/></g>
    </mask>
  </defs>
  <path d="M80 150 v42 l8 -7 l8 7 v-42 z" fill="#D9893A"/>
  <circle cx="100" cy="100" r="70" fill="#C08A22" mask="url(#a1-moon)"/>
  <path d="M150 58 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4 z" fill="#C08A22"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
